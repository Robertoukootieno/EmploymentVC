apiVersion: v1
kind: ConfigMap
metadata:
  name: employmentvc-config
  namespace: employmentvc
data:
  # Observability
  PROMETHEUS_ENABLED: "true"
  TRACING_ENABLED: "true"
  LOG_LEVEL: "INFO"
  
  # DID Configuration
  DID_METHODS_SUPPORTED: "did:web,did:key,did:ethr"
  UNIVERSAL_RESOLVER_URL: "https://dev.uniresolver.io"
  
  # Credential Configuration
  DEFAULT_CREDENTIAL_EXPIRATION_DAYS: "365"
  CREDENTIAL_CONTEXT: "https://www.w3.org/2018/credentials/v1"
  
  # Security
  KEYCLOAK_REALM: "employmentvc"
  OPA_URL: "http://opa.employmentvc.svc.cluster.local:8181"
  
  # Service URLs (Internal)
  AUTH_SERVICE_URL: "http://auth-service.employmentvc.svc.cluster.local:8081"
  DID_REGISTRY_URL: "http://did-registry.employmentvc.svc.cluster.local:8082"
  ISSUER_SERVICE_URL: "http://issuer-service.employmentvc.svc.cluster.local:8083"
  VERIFIER_SERVICE_URL: "http://verifier-service.employmentvc.svc.cluster.local:8084"
  SCHEMA_REGISTRY_URL: "http://schema-registry.employmentvc.svc.cluster.local:8086"
  WALLET_SERVICE_URL: "http://custodial-wallet.employmentvc.svc.cluster.local:8087"
  NONCUSTODIAL_GATEWAY_URL: "http://noncustodial-gateway.employmentvc.svc.cluster.local:8088"
  WORKFLOW_SERVICE_URL: "http://workflow-service.employmentvc.svc.cluster.local:8089"
  NOTIFICATION_SERVICE_URL: "http://notification-service.employmentvc.svc.cluster.local:8090"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  namespace: employmentvc
data:
  POSTGRES_HOST: "postgresql.employmentvc.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB_AUTH: "employmentvc_auth"
  POSTGRES_DB_DID: "employmentvc_did"
  POSTGRES_DB_ISSUER: "employmentvc_issuer"
  POSTGRES_DB_VERIFIER: "employmentvc_verifier"
  POSTGRES_DB_SCHEMA: "employmentvc_schema"
  POSTGRES_DB_WALLET: "employmentvc_wallet"
  POSTGRES_DB_WORKFLOW: "employmentvc_workflow"
  POSTGRES_DB_NOTIFICATION: "employmentvc_notification"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: employmentvc
data:
  REDIS_HOST: "redis.employmentvc.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
