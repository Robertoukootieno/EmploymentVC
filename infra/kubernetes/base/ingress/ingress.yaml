apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employmentvc-ingress
  namespace: employmentvc
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  tls:
    - hosts:
        - api.employmentvc.com
        - employer.employmentvc.com
        - employee.employmentvc.com
      secretName: employmentvc-tls
  rules:
    - host: api.employmentvc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
    
    - host: employer.employmentvc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: employer-portal
                port:
                  number: 3000
    
    - host: employee.employmentvc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: employee-portal
                port:
                  number: 3000
