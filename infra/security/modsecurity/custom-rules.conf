# Custom ModSecurity Rules for EmploymentVC
# These rules complement OWASP CRS for application-specific protection

# ===== API-Specific Rules =====

# Protect /api/credentials endpoints
SecRule REQUEST_URI "@beginsWith /api/credentials" "id:30001,phase:1,chain,log,msg:'Credentials API request'"
    SecRule REQUEST_METHOD "!@rx ^(GET|POST|PUT|DELETE)$" "deny,status:405"

SecRule REQUEST_URI "@beginsWith /api/auth" "id:30002,phase:1,log,msg:'Auth API request'"

# Protect /api/did endpoints
SecRule REQUEST_URI "@beginsWith /api/did" "id:30003,phase:1,log,msg:'DID API request'"

# ===== Suspicious User-Agent Detection =====

# Block malicious user agents
SecRule REQUEST_HEADERS:User-Agent "@rx (sqlmap|nikto|nmap|nessus|masscan|whoami|metasploit)" \
    "id:31001,deny,status:403,log,msg:'Detected malicious User-Agent: %{REQUEST_HEADERS:User-Agent}'"

# Block missing User-Agent for sensitive endpoints
SecRule REQUEST_URI "@beginsWith /api/" "id:31002,chain,log,msg:'Missing User-Agent on API endpoint'"
    SecRule &REQUEST_HEADERS:User-Agent "@eq 0" "deny,status:400"

# ===== JWT Token Validation =====

# Check for Authorization header on API endpoints
SecRule REQUEST_URI "@regex ^/api/(?!health|metrics|actuator).*$" "id:32001,chain,log,msg:'API request without auth check'"
    SecRule REQUEST_METHOD "@rx ^(POST|PUT|DELETE|PATCH)$" "chain"
    SecRule &REQUEST_HEADERS:Authorization "@eq 0" "deny,status:401,log"

# Validate JWT format (basic check)
SecRule REQUEST_HEADERS:Authorization "@regex ^Bearer [A-Za-z0-9\-._~\+\/]+=*$" \
    "id:32002,phase:1,nolog,pass"
SecRule REQUEST_HEADERS:Authorization "@regex ^Bearer " "id:32003,phase:1,chain,log,msg:'Invalid JWT format'"
    SecRule REQUEST_HEADERS:Authorization "!@regex ^Bearer [A-Za-z0-9\-._~\+\/]+=*$" "deny,status:401"

# ===== SQL Injection Detection (Custom) =====

# Additional SQL injection patterns
SecRule ARGS "@rx (?i)(union\s+select|select\s+from|insert\s+into|delete\s+from|drop\s+table|exec\s+|execute\s+)" \
    "id:33001,deny,status:403,log,msg:'Potential SQL injection detected in arguments'"

SecRule REQUEST_BODY "@rx (?i)(union\s+select|select\s+from|insert\s+into|delete\s+from|drop\s+table)" \
    "id:33002,deny,status:403,log,msg:'Potential SQL injection detected in request body'"

# ===== XSS Detection (Custom) =====

# Additional XSS patterns for JSON APIs
SecRule REQUEST_BODY "@rx (?i)<script|javascript:|onerror=|onclick=|onload=" \
    "id:34001,deny,status:403,log,msg:'Potential XSS detected in request body'"

SecRule ARGS "@rx (?i)<script|javascript:|onerror=|onclick=|onload=" \
    "id:34002,deny,status:403,log,msg:'Potential XSS detected in query arguments'"

# ===== Command Injection Detection =====

SecRule ARGS "@rx (?i)\$\(.*\)|`cmd`|;&.*|&&.*|\|\|.*" \
    "id:35001,deny,status:403,log,msg:'Potential command injection detected'"

# ===== Path Traversal Detection =====

SecRule ARGS|REQUEST_BODY "@rx \.\.\/|\.\.\\|%2e%2e" \
    "id:36001,deny,status:403,log,msg:'Path traversal attempt detected'"

# ===== File Upload Protection =====

SecRule FILES_TMPNAMES "@inspectFile /etc/modsecurity.d/scripts/check-file-type.sh" \
    "id:37001,phase:2,log,msg:'File upload inspection triggered'"

# Restrict file upload size to 50MB
SecRule FILES_SIZE "@gt 52428800" "id:37002,deny,status:413,log,msg:'Upload exceeds 50MB limit'"

# ===== API Rate Limiting (Enhanced) =====

# Track requests per IP
SecRule REMOTE_ADDR "@unconditionalMatch" \
    "id:38001,phase:5,setvar:ip.requests=%{ip.requests}+1,nolog"

# Block if more than 1000 requests per 60 seconds from same IP
SecRule ip.requests "@gt 1000" "id:38002,phase:1,deny,status:429,log,msg:'Rate limit exceeded for IP: %{REMOTE_ADDR}'"

# Reset counter every 60 seconds
SecRule ip.requests "@gt 0" \
    "id:38003,expirevar:ip.requests=60,nolog"

# ===== JSON Specific Rules =====

# Validate JSON Content-Type for API endpoints
SecRule REQUEST_URI "@beginsWith /api/" "id:39001,chain,log,msg:'JSON Content-Type check'"
    SecRule REQUEST_METHOD "@rx ^(POST|PUT|PATCH)$" "chain"
    SecRule REQUEST_HEADERS:Content-Type "!@rx application/json" "deny,status:415"

# ===== Response Monitoring =====

# Log 4xx responses
SecRule RESPONSE_STATUS "@regex ^4\d\d$" "id:40001,phase:4,log,msg:'4xx Response Status: %{RESPONSE_STATUS}'"

# Log 5xx responses
SecRule RESPONSE_STATUS "@regex ^5\d\d$" "id:40002,phase:4,log,msg:'5xx Response Status: %{RESPONSE_STATUS}'"

# ===== Anomaly Scoring =====

# Increment anomaly score based on rule triggers
SecRule @inspectFile /etc/modsecurity.d/scripts/anomaly-score.sh \
    "id:41001,phase:5,pass,log,msg:'Anomaly score evaluation'"

# ===== GeoIP Blocking (Optional) =====

# Block requests from specific countries (customize as needed)
# SecRule GEO:COUNTRY_CODE "@rx ^(XX|YY)$" "id:42001,deny,status:403,log,msg:'Blocked country: %{GEO:COUNTRY_CODE}'"

# ===== Bot Protection =====

# Block known bots (non-legitimate crawlers)
SecRule REQUEST_HEADERS:User-Agent "@regex (?i)(bot|crawler|scraper)(?!google|bing|pinterest)" \
    "id:43001,deny,status:403,log,msg:'Bot detected: %{REQUEST_HEADERS:User-Agent}'"

# Require JavaScript execution for sensitive endpoints
SecRule REQUEST_URI "@beginsWith /api/wallet" "id:43002,phase:1,log,msg:'Wallet API - bot check required'"

# ===== Data Exfiltration Prevention =====

# Limit response size for sensitive endpoints
SecRule RESPONSE_HEADERS:Content-Length "@gt 104857600" "id:44001,phase:4,log,msg:'Large response detected: %{RESPONSE_HEADERS:Content-Length} bytes'"

# Monitor sensitive data in responses (PII)
SecRule RESPONSE_BODY "@rx (?i)\b\d{3}-\d{2}-\d{4}\b" "id:44002,phase:4,log,msg:'SSN pattern detected in response'"

# ===== Forensics and Tracking =====

# Log request headers for all API calls
SecRule REQUEST_URI "@beginsWith /api/" "id:50001,phase:1,log,logdata:'Headers: %{REQUEST_HEADERS}',msg:'API request headers captured'"

# Log response headers for security events
SecRule RESPONSE_STATUS "@regex ^([45]|429).*" "id:50002,phase:4,log,logdata:'Response: %{RESPONSE_HEADERS}',msg:'Security event response captured'"
