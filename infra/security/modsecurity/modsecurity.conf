# ModSecurity Core Configuration
# WAF Rules for nginx protection

# SecRuleEngine: Enable ModSecurity
SecRuleEngine On

# SecRequestBodyLimit: Max request body size (10MB - same as gateway)
SecRequestBodyLimit 10485760
SecRequestBodyNoAction On

# SecResponseBodyLimit: Max response size (10MB)
SecResponseBodyLimit 10485760

# SecTmpDir: Temporary directory for large files
SecTmpDir /tmp/modsecurity/

# SecDataDir: Persistent data directory
SecDataDir /tmp/modsecurity/data/

# Allow multipart/form-data (file uploads)
SecRequestBodyAccess On
SecRequestBodyExcludeByType application/json

# Response body inspection
SecResponseBodyAccess On

# Debug log
SecDebugLog /var/log/modsecurity/debug.log
SecDebugLogLevel 3

# Audit log
SecAuditEngine RelevantOnly
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogType Serial

# Anomaly scoring mode
SecAuditLogRelevantStatus "^(?:4|5)"
SecAuditLogFormat JSON

# Default actions
SecDefaultAction "phase:1,log,auditlog,deny,status:403"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"
SecDefaultAction "phase:3,log,auditlog,deny,status:403"
SecDefaultAction "phase:4,log,auditlog,deny,status:403"
SecDefaultAction "phase:5,log,auditlog,deny,status:403"

# Variables to track
SecCollectionTimeout 600
SecSessionTimeout 3600
SecArgumentSeparator "&"
SecCookieFormat 0
SecUnicodeMapFile unicode.mapping

# IP reputation tracking
SecStoreIp On

# Geolocation tracking (optional)
# SecGeoLookupDb /usr/share/GeoIP/GeoLite2-City.mmdb

# Protect against missing HTTP headers
SecRule &REQUEST_HEADERS:Host "@eq 0" "id:10001,phase:1,deny,status:400,log,msg:'Host header is missing'"

# Protect against empty URI
SecRule REQUEST_URI "@streq " "id:10002,phase:1,deny,status:400,log,msg:'Request URI is empty'"

# Protect against multiple slashes
SecRule REQUEST_URI "@rx ^/+/+" "id:10003,phase:1,deny,status:403,log,msg:'Multiple consecutive slashes detected'"

# Log successful requests for monitoring
SecRule RESPONSE_STATUS "@rx ^(2|3)\d\d$" "id:20000,phase:5,log,logdata:%{matched_var},msg:'Successful request'"

# Remove sensitive headers from responses
SecRule RESPONSE_HEADERS:Server "@rx .*" "id:10004,phase:3,action:replace,replaceValue:'',log,msg:'Removing Server header'"

# Limit request method
SecRule REQUEST_METHOD "@rx ^(CONNECT|DELETE|PATCH|PUT|TRACE)$" \
    "id:10101,phase:1,log,auditlog,status:405,msg:'Method %{REQUEST_METHOD} not allowed'"

# Include OWASP Core Rule Set
Include /etc/modsecurity.d/owasp-rules/REQUEST-901-INITIALIZATION.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-910-IP-REPUTATION.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-911-METHOD-ENFORCEMENT.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-913-SCANNER-DETECTION.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-920-PROTOCOL-ENFORCEMENT.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-921-PROTOCOL-ATTACK.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-930-APPLICATION-ATTACK-LFI.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-931-APPLICATION-ATTACK-RFI.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-932-APPLICATION-ATTACK-RCE.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-933-APPLICATION-ATTACK-PHP.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-934-APPLICATION-ATTACK-NODEJS.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-941-APPLICATION-ATTACK-XSS.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-942-APPLICATION-ATTACK-SQLI.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-943-APPLICATION-ATTACK-SESSION-FIXATION.conf
Include /etc/modsecurity.d/owasp-rules/REQUEST-949-BLOCKING-EVALUATION.conf
Include /etc/modsecurity.d/owasp-rules/RESPONSE-950-DATA-LOSS-PREVENTION.conf
Include /etc/modsecurity.d/owasp-rules/RESPONSE-951-DATA-LEAKAGE.conf
Include /etc/modsecurity.d/owasp-rules/RESPONSE-952-DATA-LEAKAGE-SQL.conf
Include /etc/modsecurity.d/owasp-rules/RESPONSE-953-DATA-LEAKAGE-SESSION.conf
Include /etc/modsecurity.d/owasp-rules/RESPONSE-954-DATA-LEAKAGE-IIS.conf
Include /etc/modsecurity.d/owasp-rules/RESPONSE-959-BLOCKING-EVALUATION.conf
Include /etc/modsecurity.d/owasp-rules/RESPONSE-980-CORRELATION.conf

# Custom rules for EmploymentVC
Include /etc/modsecurity.d/custom-rules.conf
