apiVersion: v2
name: employmentvc-platform
description: Employment Verification Credential Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/Robertoukootieno/EmploymentVC
sources:
  - https://github.com/Robertoukootieno/EmploymentVC
maintainers:
  - name: EmploymentVC Team
    email: team@provenly.io
keywords:
  - verifiable-credentials
  - ssi
  - kubernetes
  - microservices
icon: https://raw.githubusercontent.com/Robertoukootieno/EmploymentVC/main/docs/assets/logo.png

values:
  replicaCount: 1
  environment: production
  
subcharts:
  - name: postgresql
    version: "^12.0.0"
    repository: https://charts.bitnami.com/bitnami
    enabled: true
  - name: redis
    version: "^17.0.0"
    repository: https://charts.bitnami.com/bitnami
    enabled: false
