name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Security and Code Quality
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Test Backend Libraries
  test-backend-libraries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: [
          'auth-lib',
          'credentials-lib',
          'crypto-lib',
          'protocols-lib',
          'sdjwts-lib',
          'core-wallet-lib',
          'utils-lib',
          'did-lib',
          'library-commons',
          'openid4vc-lib'
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run library tests
        run: ./gradlew :${{ matrix.library }}:test

      - name: Run checkstyle
        run: ./gradlew :${{ matrix.library }}:checkstyleMain checkstyleTest

      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Backend Library Tests (${{ matrix.library }})
          path: backend-libraries/${{ matrix.library }}/build/test-results/test/*.xml
          reporter: java-junit

  # Test Backend Services
  test-backend-services:
    runs-on: ubuntu-latest
    needs: test-backend-libraries
    strategy:
      matrix:
        service: [
          'issuer-api',
          'verifier-api',
          'wallet-api',
          'web3-login-service',
          'e2e-test-service',
          'auth-service',
          'did-registry',
          'schema-registry',
          'api-gateway'
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: |
          cd backend/${{ matrix.service }}
          chmod +x gradlew

      - name: Run service tests
        run: ./gradlew :${{ matrix.service }}:test

      - name: Run checkstyle
        run: ./gradlew :${{ matrix.service }}:checkstyleMain checkstyleTest

      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Backend Service Tests (${{ matrix.service }})
          path: backend-services/${{ matrix.service }}/build/test-results/test/*.xml
          reporter: java-junit

  # Test Frontend Applications
  test-frontend-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [
          'issuer-app/web',
          'verifier-app/web',
          'holder-wallet/web'
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend-apps/${{ matrix.app }}/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend-apps/${{ matrix.app }}
          npm ci

      - name: Run tests
        run: |
          cd frontend-apps/${{ matrix.app }}
          npm test

      - name: Run linting
        run: |
          cd frontend-apps/${{ matrix.app }}
          npm run lint

      - name: Build application
        run: |
          cd frontend-apps/${{ matrix.app }}
          npm run build

  # Build and Push Backend Docker Images
  build-and-push-backend:
    needs: [security-scan, test-backend-libraries, test-backend-services]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        service: [
          'issuer-api',
          'verifier-api',
          'wallet-api',
          'web3-login-service',
          'auth-service',
          'did-registry',
          'schema-registry',
          'api-gateway'
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-services/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build and Push Frontend Docker Images
  build-and-push-frontend:
    needs: [security-scan, test-frontend-apps]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        app: [
          'issuer-app/web',
          'verifier-app/web',
          'holder-wallet/web'
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Development Environment
  deploy-dev:
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Development
        run: |
          echo "Deploying to development environment"
          # Add your deployment commands here
          # kubectl apply -f k8s/dev/ --context=dev-cluster

  # Deploy to Production Environment
  deploy-prod:
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment"
          # Add your deployment commands here
          # kubectl apply -f k8s/prod/ --context=prod-cluster