# Non-Custodial Wallet Gateway Configuration
spring.application.name=noncustodial-gateway
server.port=8088

# Actuator & Health Checks (stateless service - no database)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://tempo:9411/api/v2/spans

# Logging
logging.level.root=INFO
logging.level.com.employmentvc.noncustodialgateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# DIDComm Configuration
didcomm.mediator.endpoint=${DIDCOMM_MEDIATOR_ENDPOINT:http://didcomm-mediator:8080}

# OpenID4VC Configuration
openid4vc.issuer.url=${OPENID4VC_ISSUER_URL:http://issuer-service:8081}
openid4vc.verifier.url=${OPENID4VC_VERIFIER_URL:http://verifier-service:8082}

# Service Discovery
spring.cloud.kubernetes.discovery.enabled=true
spring.cloud.kubernetes.config.enabled=true
