# Failed Login Throttling Configuration
spring.security.throttle.enabled=true

# Maximum failed attempts before lockout
spring.security.throttle.max-attempts=5

# Lockout duration in minutes
spring.security.throttle.lockout-duration=15

# Time window for attempt reset in minutes (attempts expire after this time)
spring.security.throttle.reset-window=30

# Cleanup task interval in minutes
spring.security.throttle.cleanup-interval=5

# Logging
spring.security.throttle.log-level=INFO
spring.security.throttle.detailed-logging=false

# Actuator endpoints for monitoring (if actuator is enabled)
management.endpoints.web.exposure.include=health,metrics,throttling-stats
management.endpoint.health.show-details=when-authorized

# Prometheus metrics for security
management.metrics.enable.security.throttle.locked-accounts=true
management.metrics.enable.security.throttle.total-tracked=true
management.metrics.enable.auth.failed-attempts=true

# Security context for admin endpoints
spring.security.oauth2.resource.jwt.key-value=your-jwt-secret-here
