# API Gateway Security Configuration

# Rate limiting (requests per minute per IP)
security.rate-limit.enabled=true
security.rate-limit.requests-per-minute=100

# Size limits
security.size-limit.enabled=true
security.size-limit.max-request-size=10485760
security.size-limit.max-header-size=16384

# CORS configuration
cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Request timeout (in seconds)
server.servlet.session.timeout=1800

# Connection timeout
server.tomcat.connection-timeout=20000

# Thread pool configuration for security
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10

# Log suspicious activities
logging.level.io.provenly.apigateway.security=INFO

# Enable security features
spring.security.require-ssl=false # Set to true in production over HTTPS
spring.security.filter.order=5

# Actuator endpoints security
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoints.web.base-path=/actuator

# Disable unused endpoints
management.endpoints.web.exposure.exclude=env,configprops
