plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'checkstyle'
    id 'com.github.spotbugs'
}

description = 'Issuer Service - Verifiable Credential Issuance'

springBoot {
    mainClass = 'com.employmentvc.issuer.IssuerApiApplication'
}

dependencies {
    // Spring Boot starters (additional to root defaults as needed)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // OpenAPI documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

    // Monitoring
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Internal libraries (future migration to core libs)
    implementation project(':library-commons')
    implementation project(':utils-lib')

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

