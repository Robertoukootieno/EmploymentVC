plugins {
    id 'java-library'
    id 'org.springframework.boot' version '3.2.0' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
    id 'com.github.spotbugs' version '5.2.1' apply false
}

allprojects {
    group = 'io.provenly'
    version = '1.0.0'

    repositories {
        mavenCentral()
        maven {
            url 'https://repo.spring.io/release'
            content {
                includeGroupByRegex 'org\\.springframework(\\..*)?'
            }
        }
        maven {
            url 'https://repo.spring.io/milestone'
            content {
                includeGroupByRegex 'org\\.springframework(\\..*)?'
            }
        }
        maven {
            url 'https://repo.spring.io/snapshot'
            content {
                includeGroupByRegex 'org\\.springframework(\\..*)?'
            }
        }
        maven { url 'https://jitpack.io' }
    }

    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('org.testcontainers:keycloak') using module('com.github.dasniko:testcontainers-keycloak:3.4.0')
            substitute module('org.springframework.cloud:spring-cloud-open-service-broker') using module('org.springframework.cloud:spring-cloud-open-service-broker-core:4.1.0')
            substitute module('com.bisnode.opa:opa-java-client') using module('com.bisnode.opa:opa-java-client:0.4.5')
        }
    }
}

// Version definitions
ext {
    springBootVersion = '3.2.0'
    springCloudVersion = '2023.0.0'
    testcontainersVersion = '1.19.7'
    lombokVersion = '1.18.30'
    junitVersion = '5.10.1'
    mockitoVersion = '5.7.0'
    assertjVersion = '3.24.2'
}

// -----------------------------
// Backend Libraries
// -----------------------------
configure(subprojects.findAll { it.path in [
    ':vc-core',
    ':did-core',
    ':crypto-core',
    ':policy-core',
    ':observability-core',
    ':auth-lib',
    ':credentials-lib',
    ':crypto-lib',
    ':protocols-lib',
    ':sdjwts-lib',
    ':core-wallet-lib',
    ':utils-lib',
    ':did-lib',
    ':library-commons',
    ':openid4vc-lib'
]}) {

    apply plugin: 'java-library'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependencies {
        api 'org.slf4j:slf4j-api:2.0.9'
        api 'com.fasterxml.jackson.core:jackson-databind:2.16.0'
        api 'org.apache.commons:commons-lang3:3.13.0'

        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

        testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
        testImplementation "org.mockito:mockito-core:${mockitoVersion}"
        testImplementation "org.assertj:assertj-core:${assertjVersion}"
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

// -----------------------------
// Backend Services
// -----------------------------
configure(subprojects.findAll { it.path in [
    ':issuer-api',
    ':verifier-api',
    ':wallet-api',
    ':web3-login-service',
    ':e2e-test-service',
    ':auth-service',
    ':did-registry',
    ':credential-registry',
    ':schema-registry',
    ':api-gateway',
    ':workflow-service',
    ':custodial-wallet',
    ':noncustodial-gateway',
    ':notification-service'
]}) {

    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Dependency management
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    dependencies {
        // Spring Boot
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'

        // Spring Cloud
        implementation 'org.springframework.cloud:spring-cloud-starter-kubernetes-fabric8'
        implementation 'org.springframework.cloud:spring-cloud-starter-kubernetes-fabric8-all'
        implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
        implementation 'org.springframework.cloud:spring-cloud-open-service-broker-core:4.1.0'

        // Policy engine client
        implementation 'com.bisnode.opa:opa-java-client:0.4.5'

        // Database
        runtimeOnly 'org.postgresql:postgresql'

        // Monitoring
        implementation 'io.micrometer:micrometer-registry-prometheus'

        // Internal libraries
        implementation project(':library-commons')
        implementation project(':utils-lib')

        // Lombok
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

        // Testing
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.security:spring-security-test'
        testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
        testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
        testImplementation 'com.github.dasniko:testcontainers-keycloak:3.4.0'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}
