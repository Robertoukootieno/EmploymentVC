plugins {
    id 'java-library'
}

description = 'Provenly Auth Library - Shared authentication and JWT utilities'

dependencies {
    api project(':library-commons')

    api 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
}
