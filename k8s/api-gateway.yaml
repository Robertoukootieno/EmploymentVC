apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: provenly
  labels:
    app: api-gateway
    component: gateway
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        component: gateway
        tier: frontend
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/robertoukootieno/employmentvc/api-gateway:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: API_GATEWAY_PORT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: provenly-secrets
              key: JWT_SECRET
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: KEYCLOAK_URL
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: KEYCLOAK_URL
        - name: KEYCLOAK_REALM
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: KEYCLOAK_REALM
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: KEYCLOAK_CLIENT_ID
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: provenly-secrets
              key: KEYCLOAK_CLIENT_SECRET
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: AUTH_SERVICE_URL
        - name: DID_REGISTRY_URL
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: DID_REGISTRY_URL
        - name: SCHEMA_REGISTRY_URL
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: SCHEMA_REGISTRY_URL
        - name: ISSUER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: ISSUER_SERVICE_URL
        - name: VERIFIER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: VERIFIER_SERVICE_URL
        - name: HOLDER_WALLET_URL
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: HOLDER_WALLET_URL
        - name: ORCHESTRATION_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: ORCHESTRATION_SERVICE_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: provenly
  labels:
    app: api-gateway
    component: gateway
    tier: frontend
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: provenly
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - api.provenly.io
    secretName: api-gateway-tls
  rules:
  - host: api.provenly.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: provenly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
