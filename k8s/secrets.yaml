apiVersion: v1
kind: Secret
metadata:
  name: provenly-secrets
  namespace: provenly
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: "provenly_user"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_DB: "provenly_db"
  
  # Redis credentials
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # JWT secrets
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_SUPER_SECURE_KEY"
  
  # Keycloak credentials
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  
  # EBSI credentials
  EBSI_CLIENT_ID: "your_ebsi_client_id"
  EBSI_CLIENT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  EBSI_PRIVATE_KEY: "CHANGE_ME_IN_PRODUCTION"
  
  # Walt.id API key
  WALTID_API_KEY: "CHANGE_ME_IN_PRODUCTION"
  
  # AWS credentials (for file storage)
  AWS_ACCESS_KEY_ID: "your_aws_access_key"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_IN_PRODUCTION"
  
  # Email service credentials
  SMTP_USER: "your_email@example.com"
  SMTP_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Hyperledger Besu private key
  BESU_PRIVATE_KEY: "CHANGE_ME_IN_PRODUCTION"
---
apiVersion: v1
kind: Secret
metadata:
  name: provenly-dev-secrets
  namespace: provenly-dev
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: "provenly_dev"
  POSTGRES_PASSWORD: "dev_password"
  POSTGRES_DB: "provenly_dev"
  
  # Redis credentials
  REDIS_PASSWORD: "dev_redis_password"
  
  # JWT secrets
  JWT_SECRET: "dev_jwt_secret_not_for_production"
  
  # Keycloak credentials
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "dev_admin_password"
  KEYCLOAK_CLIENT_SECRET: "dev_client_secret"
  
  # EBSI credentials (pilot environment)
  EBSI_CLIENT_ID: "dev_ebsi_client_id"
  EBSI_CLIENT_SECRET: "dev_ebsi_client_secret"
  EBSI_PRIVATE_KEY: "dev_ebsi_private_key"
  
  # Walt.id API key
  WALTID_API_KEY: "dev_waltid_api_key"
  
  # Hyperledger Besu private key (development)
  BESU_PRIVATE_KEY: "0x8f2a55949038a9610f50fb23b5883af3b4ecb3c3bb792cbcefbd1542c692be63"
