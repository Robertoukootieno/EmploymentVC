apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: provenly
  labels:
    app: schema-registry
    component: schema-registry
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
        component: schema-registry
        tier: backend
    spec:
      containers:
      - name: schema-registry
        image: ghcr.io/robertoukootieno/employmentvc/schema-registry:latest
        ports:
        - containerPort: 8086
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: provenly-config
              key: SPRING_PROFILES_ACTIVE
        - name: SERVER_PORT
          value: "8086"
        - name: DATABASE_URL
          value: "jdbc:postgresql://postgres-service:5432/employmentvc_schema"
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: provenly-secrets
              key: POSTGRES_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: provenly-secrets
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8086
          initialDelaySeconds: 15
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry-service
  namespace: provenly
  labels:
    app: schema-registry
    component: schema-registry
    tier: backend
spec:
  selector:
    app: schema-registry
  ports:
  - port: 8086
    targetPort: 8086
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: schema-registry-hpa
  namespace: provenly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: schema-registry
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
